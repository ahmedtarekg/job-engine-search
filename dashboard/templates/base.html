<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Engine Search{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Job Engine Search</h1>
            <span class="subtitle">Materials Science & Semiconductors · Ghent +100km</span>
        </div>
        <div class="header-actions">
            <span id="pipeline-indicator" class="pipeline-idle">●</span>
            <button id="run-btn" onclick="runPipeline()">Run Now</button>
            <span class="timestamp">{{ now }}</span>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
